[terminal]
vt = 1

# Autologin session executed automatically on system boot
# [initial_session]
# command = "sh -c 'env UWSM_SILENT_START=2 uwsm start -g -1 -- niri.desktop"
# user = "__USER__"

# Fallback greeter session shown after logging out
[default_session]
command = "tuigreet --time --remember --remember-session --asterisks --cmd 'env UWSM_SILENT_START=2 uwsm start -g -1 -- niri.desktop'"
user = "greeter"
