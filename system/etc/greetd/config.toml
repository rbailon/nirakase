[terminal]
vt = 1

# Autologin session executed automatically on system boot
[initial_session]
command = "uwsm start -g 0 -- niri.desktop > /dev/null 2&>1"
user = "__USER__"

# Fallback greeter session shown after logging out
[default_session]
command = "tuigreet --time --remember --remember-session --asterisks --cmd 'env UWSM_SILENT_START=2 uwsm start -g 0 -- niri.desktop'"
user = "greeter"
