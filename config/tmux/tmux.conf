# ==============================================================================
# Nirakase: tmux.conf (Optimized for Spanish ISO-ES keyboard)
# Location: ~/.config/tmux/tmux.conf
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. General & Terminal (Foot and TrueColor compatibility)
# ------------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,foot*:RGB"

set -g mouse on                     # Enable mouse support (click panes, scroll, resize)
set -s escape-time 0                # Remove ESC delay (essential for Neovim)
set -g history-limit 50000          # Increase scrollback history
set -g focus-events on              # Focus events for editors like Neovim
set -g set-clipboard on             # Wayland clipboard integration (OSC 52 / Foot)

# Start window and pane indices at 1 (on the keyboard 1 is on the left, 0 is on the right)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on          # Automatically renumber windows when one is closed

# ------------------------------------------------------------------------------
# 2. Prefix (Leader Key)
# ------------------------------------------------------------------------------
# Ctrl+Space is much more ergonomic than Ctrl+b (pressed with the thumb)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ------------------------------------------------------------------------------
# 3. Keybindings adapted for Spanish Keyboard (ISO-ES)
# ------------------------------------------------------------------------------
# On a Spanish keyboard:
# - '%' (Shift+5) and '"' (Shift+2) for splitting are awkward and unintuitive.
# - '[' and ']' require AltGr+` and AltGr++ (very awkward for entering copy mode or pasting).
# - '{' and '}' require AltGr+´ and AltGr+ç.
# - ';' requires Shift+, and '~' requires AltGr+4.

# Quickly reload configuration with Prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "✔ Tmux configuration reloaded"

# Split panes visually and directly (without Shift or AltGr), keeping the current directory:
# '-' (direct key on Spanish layout) -> horizontal split (top/bottom)
# 'v' (or '|')                       -> vertical split (left/right)
unbind '"'
unbind %
bind v split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window keeping the current directory
bind c new-window -c "#{pane_current_path}"

# Copy Mode:
# Default is Prefix + '[' (AltGr + ` in Spanish). Mapped to Prefix + Escape or Prefix + Space
bind Escape copy-mode
bind Space copy-mode
bind p paste-buffer                 # Paste with Prefix + p (instead of Prefix + ']')

# Vim-style navigation in copy mode + wl-clipboard integration (Wayland)
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

# Move between splits (panes):
# 1) Direct without prefix: Alt + Arrow keys
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
# Alternative keys
bind -n C-M-h select-pane -L
bind -n C-M-l select-pane -R
bind -n C-M-k select-pane -U
bind -n C-M-j select-pane -D


# 2) With prefix + Arrow keys (or h, j, k, l)
bind Left select-pane -L
bind Right select-pane -R
bind Up select-pane -U
bind Down select-pane -D
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes by holding Prefix + Ctrl + Arrow keys (or h/j/k/l)
bind -r C-Left resize-pane -L 5
bind -r C-Down resize-pane -D 5
bind -r C-Up resize-pane -U 5
bind -r C-Right resize-pane -R 5
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# Swap panes (default is '{' and '}', which require AltGr on Spanish layout)
bind > swap-pane -D
bind < swap-pane -U

# Last active pane (default is ';', which requires Shift + , on Spanish layout)
bind Tab last-pane                  # Prefix + Tab switches to the last used pane
bind a last-window                  # Prefix + a switches to the last used window

# Quickly switch windows with Alt + Shift + Left/Right or Alt + Number (without Prefix)
bind -n M-S-Left previous-window
bind -n M-H previous-window
bind -n M-S-Right next-window
bind -n M-L next-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Close pane without confirmation with Prefix + x
bind x kill-pane

# ------------------------------------------------------------------------------
# 4. Aesthetics (Catppuccin Mocha theme - matching Foot)
# ------------------------------------------------------------------------------
set -g status-position top
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Left: Session name
set -g status-left-length 40
set -g status-left "#[bg=#cba6f7,fg=#11111b,bold] ❐ #S #[bg=#1e1e2e,fg=#cba6f7] "

# Right: Current directory and Time
set -g status-right-length 80
set -g status-right "#[fg=#89b4fa] #{b:pane_current_path} #[fg=#45475a]│ #[fg=#a6adc8] %H:%M "

# Window format in the status bar
setw -g window-status-format "#[fg=#6c7086] #I:#W "
setw -g window-status-current-format "#[bg=#313244,fg=#cba6f7,bold] #I:#W#{?window_zoomed_flag, ,} "

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"

# Messages and command mode
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#45475a,fg=#cdd6f4"
